    <!--
      IDs de medicao do site. Este e o unico lugar que precisa ser editado.
      Enquanto um ID estiver como SUBSTITUIR, a ferramenta nao carrega e nada e enviado.
    -->
    <script>
      window.__ANALYTICS__ = {
        ga4: 'G-SUBSTITUIR',
        clarity: 'SUBSTITUIR',
        ads: 'AW-17789690534',
        adsWhatsAppLabel: 'AW-17789690534/1tfpCLyTl84bEKbF5KJC'
      };
      window.__ANALYTICS_ON__ = function (id) {
        return typeof id === 'string' && id.indexOf('SUBSTITUIR') === -1;
      };
    </script>

    <!--
      Carregamento adiado das tags do Google (GTM e gtag.js do Ads/GA4).
      Juntas elas ocupam ~1 s de processador no celular e derrubavam a nota do
      PageSpeed de ~90 para ~58. Aqui os scripts so baixam no primeiro toque,
      rolagem, tecla ou movimento do mouse - ou 6 s depois do load, para quem nao
      interage. Tudo que for chamado antes (gtag('config'), conversoes, eventos do
      dataLayer) fica na fila do dataLayer e e enviado quando os scripts chegam.
      Troca conhecida: quem toca no WhatsApp no primeiro instante pode sair para o
      app antes do gtag.js carregar, e essa conversao nao chega ao Ads (o lead e o
      codigo [G-...] na mensagem nao sao afetados).
    -->
    <script>
      (function () {
        var loaded = false;
        var triggers = ['pointerdown', 'touchstart', 'keydown', 'scroll', 'mousemove'];
        var add = function (src) {
          var s = document.createElement('script');
          s.async = true;
          s.src = src;
          document.head.appendChild(s);
        };
        var load = function () {
          if (loaded) return;
          loaded = true;
          triggers.forEach(function (t) { window.removeEventListener(t, load, true); });
          add('https://www.googletagmanager.com/gtm.js?id=GTM-NSJN7LJ3');
          add('https://www.googletagmanager.com/gtag/js?id=' + window.__ANALYTICS__.ads);
        };
        window.__loadGoogleTags = load;
        triggers.forEach(function (t) { window.addEventListener(t, load, { capture: true, passive: true }); });
        window.addEventListener('load', function () { setTimeout(load, 6000); });
      })();
    </script>

    <!-- Google Tag Manager (o script em si entra pelo carregador acima) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
    </script>
    <!-- End Google Tag Manager -->

    <!-- Google Ads + GA4 (gtag.js, carregado pelo carregador adiado acima) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', window.__ANALYTICS__.ads);
      // GA4: este config ja envia o page view da primeira tela.
      // As trocas de rota da SPA sao enviadas pelo AnalyticsTracker (src/components).
      if (window.__ANALYTICS_ON__(window.__ANALYTICS__.ga4)) {
        gtag('config', window.__ANALYTICS__.ga4);
      }
    </script>

    <!-- Microsoft Clarity: mapa de calor de clique e scroll + gravacao de sessao -->
    <script>
      if (window.__ANALYTICS_ON__(window.__ANALYTICS__.clarity)) {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src='https://www.clarity.ms/tag/'+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window,document,'clarity','script',window.__ANALYTICS__.clarity);
      }
    </script>

    <!-- Clique no WhatsApp: conversao do Ads, lead no GA4 e marcacao no Clarity -->
    <script>
      document.addEventListener('click', function(e) {
        var link = e.target.closest('a');
        if (!link || !link.href || link.href.indexOf('wa.me') === -1) return;

        // Clique por teclado nao passa por pointerdown: garante que as tags estao vindo.
        window.__loadGoogleTags();

        var A = window.__ANALYTICS__;

        gtag('event', 'conversion', {
          'send_to': A.adsWhatsAppLabel,
          'value': 1.0,
          'currency': 'BRL'
        });

        if (window.__ANALYTICS_ON__(A.ga4)) {
          gtag('event', 'generate_lead', {
            'send_to': A.ga4,
            'method': 'whatsapp',
            'page_path': window.location.pathname
          });
        }

        // Marca a sessao no Clarity e pede para ela ser guardada,
        // para dar para assistir so quem clicou no WhatsApp.
        if (window.clarity) {
          window.clarity('set', 'whatsapp_click', 'sim');
          window.clarity('upgrade', 'whatsapp_click');
        }
      });
    </script>

    <!-- Umami (analytics self-hosted da Egide): pageviews e trocas de rota da SPA.
         data-domains limita o envio aos dois hosts que servem este build. -->
    <script defer src="https://analytics.egidedigital.com.br/script.js"
      data-website-id="9ee738fb-67de-4d1a-b5a2-6be4efe86dbd"
      data-domains="novo.clinicalacerda.com,clinicalacerda.com"></script>

    <!-- recorder.js: coleta de heatmaps. Complementa o script.js acima, nao o substitui:
         espera window.umami.getSession().cache, que so existe depois do primeiro pageview
         do script.js. Nao le data-domains, mas herda o filtro: fora dos dois hosts o
         script.js nao cria sessao e o recorder nao envia nada. -->
    <script defer src="https://analytics.egidedigital.com.br/recorder.js"
      data-website-id="9ee738fb-67de-4d1a-b5a2-6be4efe86dbd"></script>
